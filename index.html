<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LOTR Marathon RSVP</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background-color: #1b1610;
      background-image: linear-gradient(rgba(27, 22, 16, 0.45), rgba(27, 22, 16, 0.45)), url("assets/rivendell.jpg");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      color: #e8d9b0;
      font-family: Georgia, serif;
      line-height: 1.5;
    }
    main {
      max-width: 34rem;
      margin: 2rem auto;
      padding: 2.5rem 1.5rem;
      background: rgba(27, 22, 16, 0.82);
      border-radius: 12px;
    }
    @media (max-width: 36rem) { main { margin: 0; border-radius: 0; } }
    header { text-align: center; margin-bottom: 2rem; }
    h1 { font-size: 2.25rem; margin: 0 0 0.25rem; }
    .ring { height: 1.1em; vertical-align: middle; }
    .tagline { opacity: 0.8; margin: 0; }
    .details {
      border: 1px solid #5a4a2c;
      border-radius: 8px;
      padding: 1rem 1.25rem;
      margin-bottom: 2rem;
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 0.25rem 1rem;
    }
    .details dt { opacity: 0.7; }
    .details dd { margin: 0; }
    .todo { color: #d9a441; }
    form { display: grid; gap: 1.25rem; }
    label, legend { display: block; margin-bottom: 0.35rem; font-weight: bold; }
    fieldset { border: 0; padding: 0; margin: 0; }
    .choice { display: flex; gap: 1.5rem; }
    .choice label { font-weight: normal; display: flex; align-items: center; gap: 0.4rem; margin: 0; }
    input[type="text"], textarea {
      width: 100%;
      padding: 0.6rem 0.75rem;
      background: #2a2218;
      color: inherit;
      border: 1px solid #5a4a2c;
      border-radius: 6px;
      font: inherit;
    }
    input:focus-visible, textarea:focus-visible, button:focus-visible {
      outline: 2px solid #d9a441;
      outline-offset: 2px;
    }
    button {
      padding: 0.75rem 1rem;
      background: #d9a441;
      color: #1b1610;
      border: 0;
      border-radius: 6px;
      font: inherit;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled { opacity: 0.5; cursor: default; }
    .hp { position: absolute; left: -9999px; }
    #status { min-height: 1.5em; text-align: center; margin: 0; }
    #status.error { color: #e07a5f; }

    .snacks { margin-top: 3rem; border-top: 1px solid #5a4a2c; padding-top: 2rem; }
    .snacks h2 { font-size: 1.6rem; margin: 0 0 0.25rem; text-align: center; }
    .snacks .intro { text-align: center; opacity: 0.8; margin: 0 0 1.25rem; }
    #coverage { text-align: center; margin: 0 0 1.5rem; }
    #coverage.needed { color: #d9a441; }
    .mute {
      position: fixed;
      top: 1rem;
      right: 1rem;
      z-index: 10;
      width: 2.75rem;
      height: 2.75rem;
      padding: 0;
      display: grid;
      place-items: center;
      background: rgba(27, 22, 16, 0.82);
      border: 1px solid #5a4a2c;
      border-radius: 50%;
      color: #e8d9b0;
      font-size: 0.7rem;
    }
    .mute[hidden] { display: none; }
    .mute img { width: 1.5rem; height: 1.5rem; }
    .meals { border: 1px solid #5a4a2c; border-radius: 8px; padding: 0.75rem 1.25rem; margin: 0 0 1.5rem; }
    .meals h3 { font-size: 1rem; margin: 0 0 0.5rem; }
    .meals dl { display: grid; grid-template-columns: auto 1fr; gap: 0.15rem 1rem; margin: 0; }
    .meals dt { opacity: 0.7; }
    .meals dd { margin: 0; }
    select {
      width: 100%;
      padding: 0.6rem 0.75rem;
      background: #2a2218;
      color: inherit;
      border: 1px solid #5a4a2c;
      border-radius: 6px;
      font: inherit;
    }
    .category h3 { font-size: 1.1rem; margin: 0 0 0.5rem; display: flex; align-items: center; gap: 0.6rem; }
    .badge { font-size: 0.75rem; font-weight: normal; padding: 0.1rem 0.5rem; border-radius: 999px; border: 1px solid; }
    .badge.needed { color: #d9a441; border-color: #d9a441; }
    .badge.covered { color: #9bb67c; border-color: #9bb67c; }
    .items { display: grid; gap: 0.35rem; }
    .item { display: flex; align-items: baseline; gap: 0.5rem; margin: 0; font-weight: normal; }
    .item.claimed { opacity: 0.45; text-decoration: line-through; }
    .item .who { font-size: 0.85rem; text-decoration: none; display: inline-block; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>The LOTR Marathon <img src="assets/onering.png" alt="The One Ring" class="ring"></h1>
      <p class="tagline">All three extended editions, about 12 hours. Will you join the Fellowship?</p>
    </header>

    <dl class="details">
      <dt>Date</dt><dd>Saturday, October 10</dd>
      <dt>Start time</dt><dd>8:30 AM</dd>
      <dt>Where</dt><dd class="todo">[ADDRESS TBD]</dd>
    </dl>

    <form id="rsvp">
      <div>
        <label for="name">Your name</label>
        <input type="text" id="name" name="name" required maxlength="100" autocomplete="name">
      </div>

      <fieldset>
        <legend>Will you be there?</legend>
        <div class="choice">
          <label><input type="radio" name="attending" value="Yes" required> Yes</label>
          <label><input type="radio" name="attending" value="No"> No</label>
        </div>
      </fieldset>

      <div>
        <label for="dietary">Dietary needs (optional)</label>
        <textarea id="dietary" name="dietary" rows="3" maxlength="500" placeholder="Allergies, vegetarian, etc."></textarea>
      </div>

      <!-- Honeypot: real people never see or fill this in -->
      <input type="text" name="website" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">

      <button type="submit" id="submit">Send RSVP</button>
      <p id="status" role="status"></p>
    </form>

    <section class="snacks">
      <h2>Snack Signup</h2>
      <p class="intro">Twelve hours is a long road. Pick one thing to bring. Taken items are grayed out.</p>

      <div class="meals">
        <h3>Hobbit meal times</h3>
        <dl id="meal-schedule"></dl>
      </div>

      <p id="coverage" role="status"></p>

      <form id="snack-form">
        <div>
          <label for="snack-name">Your name</label>
          <input type="text" id="snack-name" name="name" required maxlength="100" autocomplete="name">
        </div>

        <div>
          <label for="meal">Which meal is it for?</label>
          <select id="meal" name="meal"></select>
        </div>

        <div id="catalog" class="catalog" style="display: grid; gap: 1.25rem;"></div>

        <input type="text" name="website" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">

        <button type="submit" id="snack-submit" disabled>Claim it</button>
        <p id="snack-status" role="status"></p>
      </form>
    </section>
  </main>

  <audio id="music" src="assets/Concerning%20Hobbits.mp3" loop preload="auto"></audio>
  <button type="button" id="mute" class="mute" hidden>
    <img id="mute-icon" src="assets/sound_on.ico" alt="Mute music">
  </button>

  <script>
    // Paste your Google Apps Script web app URL here (see README.md).
    const ENDPOINT = "https://script.google.com/macros/s/AKfycby8G1Cu265xtC2A7f_3Mzvvjzvcgf1HtGGLFfYdpo4fK5Zqz1w-HVzwne2UFyLI277-cA/exec";

    const form = document.getElementById("rsvp");
    const button = document.getElementById("submit");
    const status = document.getElementById("status");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      status.className = "";

      if (ENDPOINT.startsWith("PASTE_")) {
        status.className = "error";
        status.textContent = "RSVP isn't connected yet. Please check back soon.";
        return;
      }

      button.disabled = true;
      status.textContent = "Sending...";
      try {
        // no-cors: Apps Script doesn't send CORS headers, so the response is opaque.
        await fetch(ENDPOINT, {
          method: "POST",
          mode: "no-cors",
          body: new URLSearchParams(new FormData(form)),
        });
        form.reset();
        status.textContent = "Thanks! Your RSVP is in.";
      } catch (err) {
        status.className = "error";
        status.textContent = "Something went wrong. Please try again.";
        button.disabled = false;
        return;
      }
      button.disabled = false;
    });

    // ---- Snack signup ----
    // Item ids are stored in the sheet; keep them stable once people have claimed them.
    const CATALOG = [
      { title: "Savory snacks", items: [
        ["savory-sausage-rolls", "Sausage rolls (Second Breakfast)"],
        ["savory-cheese-board", "Cheese and crackers (Shire cheese board)"],
        ["savory-mushroom-tarts", "Mushroom tarts (Farmer Maggot's mushrooms)"],
        ["savory-potatoes", "Roast baby potatoes or wedges (Po-ta-toes!)"],
        ["savory-popcorn", "Popcorn"],
        ["savory-meat-plate", "Cured meats and bread (Rohan feast plate)"],
        ["savory-veggie-hummus", "Veggie sticks and hummus"],
      ]},
      { title: "Sweet snacks", items: [
        ["sweet-lembas", "Lembas (honey shortbread)"],
        ["sweet-seed-cake", "Seed cake"],
        ["sweet-apple-tarts", "Apple tarts or hand pies"],
        ["sweet-cookies", "Cookies"],
        ["sweet-brownies", "Brownies"],
        ["sweet-fruit", "Fruit platter (Ithilien harvest)"],
        ["sweet-candy", "Candy and gummies"],
      ]},
      { title: "Savory drinks", items: [
        ["sdrink-ale", "Dark ale or stout (Prancing Pony, 21+)"],
        ["sdrink-tomato", "Tomato juice or Bloody Mary mix"],
        ["sdrink-dry-cider", "Dry cider (21+)"],
        ["sdrink-red-wine", "Red wine (Dorwinion, 21+)"],
        ["sdrink-broth", "Hot broth or soup in mugs"],
      ]},
      { title: "Sweet drinks", items: [
        ["wdrink-ginger-beer", "Ginger beer (Ent-draught)"],
        ["wdrink-mead", "Mead (21+)"],
        ["wdrink-apple-cider", "Sweet or spiced apple cider"],
        ["wdrink-lemonade", "Lemonade"],
        ["wdrink-hot-chocolate", "Hot chocolate"],
        ["wdrink-sparkling-juice", "Sparkling grape juice"],
      ]},
      { title: "Caffeine", items: [
        ["caf-coffee", "Coffee (thermos or urn)"],
        ["caf-black-tea", "Black tea (for proper tea time)"],
        ["caf-iced-tea", "Iced tea"],
        ["caf-cola", "Cola"],
        ["caf-energy", "Energy drinks"],
      ]},
    ];

    // Hobbit meal schedule. Names are stored in the sheet and validated server-side (Code.gs MEALS).
    const MEALS = [
      ["Breakfast", "8:30 AM"],
      ["Second Breakfast", "9:30 AM"],
      ["Elevenses", "11:00 AM"],
      ["Luncheon", "1:00 PM"],
      ["Afternoon Tea", "3:00 PM"],
      ["Dinner", "6:00 PM"],
      ["Supper", "9:00 PM"],
    ];

    const mealSelect = document.getElementById("meal");
    const mealSchedule = document.getElementById("meal-schedule");
    mealSelect.append(new Option("Any meal", ""));
    for (const [name, time] of MEALS) {
      const dt = document.createElement("dt");
      dt.textContent = time;
      const dd = document.createElement("dd");
      dd.textContent = name;
      mealSchedule.append(dt, dd);
      mealSelect.append(new Option(`${name} (${time})`, name));
    }

    const snackForm = document.getElementById("snack-form");
    const catalogEl = document.getElementById("catalog");
    const coverageEl = document.getElementById("coverage");
    const snackButton = document.getElementById("snack-submit");
    const snackStatus = document.getElementById("snack-status");

    async function fetchClaims() {
      const res = await fetch(`${ENDPOINT}?action=claims&t=${Date.now()}`);
      return (await res.json()).claims;
    }

    function renderCatalog(claims) {
      const byItem = new Map(claims.map((c) => [c.item, c]));
      const needed = [];
      const selected = snackForm.querySelector('input[name="item"]:checked')?.value;
      catalogEl.replaceChildren();

      for (const cat of CATALOG) {
        const section = document.createElement("fieldset");
        section.className = "category";

        const legend = document.createElement("legend");
        const heading = document.createElement("h3");
        heading.textContent = cat.title + " ";
        const covered = cat.items.some(([id]) => byItem.has(id));
        const badge = document.createElement("span");
        badge.className = "badge " + (covered ? "covered" : "needed");
        badge.textContent = covered ? "covered" : "needed";
        heading.append(badge);
        legend.append(heading);
        section.append(legend);
        if (!covered) needed.push(cat.title.toLowerCase());

        const list = document.createElement("div");
        list.className = "items";
        for (const [id, label] of cat.items) {
          const claim = byItem.get(id);
          const row = document.createElement("label");
          row.className = "item" + (claim ? " claimed" : "");

          const input = document.createElement("input");
          input.type = "radio";
          input.name = "item";
          input.value = id;
          input.disabled = Boolean(claim);
          input.checked = id === selected && !claim;
          row.append(input, document.createTextNode(label));

          if (claim) {
            const who = document.createElement("span");
            who.className = "who";
            who.textContent = ` (${claim.name})`;
            row.append(who);
          }
          list.append(row);
        }
        section.append(list);
        catalogEl.append(section);
      }

      coverageEl.className = needed.length ? "needed" : "";
      coverageEl.textContent = needed.length
        ? `Still needed: ${needed.join(", ")}.`
        : "Every category is covered. Extra items are still welcome!";
      snackButton.disabled = false;
    }

    // Apps Script is slow (2-4s warm, much longer cold), so draw the catalog right away
    // from the last claims this browser saw, then refresh when the real list arrives.
    function saveClaims(claims) {
      try { localStorage.setItem("claims", JSON.stringify(claims)); } catch (err) {}
    }

    async function loadCatalog() {
      let cached = [];
      try { cached = JSON.parse(localStorage.getItem("claims") || "[]"); } catch (err) {}
      renderCatalog(cached);
      coverageEl.className = "";
      coverageEl.textContent = "Checking what's already taken...";

      try {
        const claims = await fetchClaims();
        saveClaims(claims);
        renderCatalog(claims);
      } catch (err) {
        coverageEl.className = "needed";
        coverageEl.textContent = "Couldn't check what's taken. You can still pick; duplicates are blocked when you submit.";
      }
    }

    snackForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const data = new FormData(snackForm);
      const item = data.get("item");
      snackStatus.className = "";
      if (!item) {
        snackStatus.className = "error";
        snackStatus.textContent = "Pick something to bring first.";
        return;
      }

      // The response to a no-cors POST is opaque, so tag the claim with a random ref
      // and read the claims list back to see whether we won the item.
      const ref = Math.random().toString(36).slice(2, 12);
      data.append("type", "snack");
      data.append("ref", ref);

      snackButton.disabled = true;
      snackStatus.textContent = "Claiming...";
      try {
        await fetch(ENDPOINT, { method: "POST", mode: "no-cors", body: new URLSearchParams(data) });
        const claims = await fetchClaims();
        saveClaims(claims);
        renderCatalog(claims);
        const mine = claims.find((c) => c.item === item);
        if (mine && mine.ref === ref) {
          snackStatus.textContent = "You're on the list. Thank you!";
        } else {
          snackStatus.className = "error";
          snackStatus.textContent = "Someone else just claimed that one. Please pick another.";
        }
      } catch (err) {
        snackStatus.className = "error";
        snackStatus.textContent = "Something went wrong. Please try again.";
        snackButton.disabled = false;
      }
    });

    loadCatalog();

    // ---- Background music ----
    const music = document.getElementById("music");
    const muteButton = document.getElementById("mute");
    const muteIcon = document.getElementById("mute-icon");
    let muted = false;
    try { muted = localStorage.getItem("muted") === "1"; } catch (err) {}
    music.volume = 0.5;

    function syncMute() {
      music.muted = muted;
      muteIcon.src = muted ? "assets/sound_off.png" : "assets/sound_on.ico";
      muteIcon.alt = muted ? "Unmute music" : "Mute music";
      muteButton.setAttribute("aria-label", muteIcon.alt);
    }
    syncMute();

    // The button only appears once the mp3 has actually loaded.
    music.addEventListener("canplay", () => { muteButton.hidden = false; }, { once: true });

    // Browsers block sound until the visitor interacts with the page: try now,
    // then again on the first click, tap, or keypress. Muting keeps the track running
    // silently so unmuting is instant.
    const startMusic = () => music.play().catch(() => {});
    startMusic();
    addEventListener("pointerdown", startMusic, { once: true });
    addEventListener("keydown", startMusic, { once: true });

    muteButton.addEventListener("click", () => {
      muted = !muted;
      try { localStorage.setItem("muted", muted ? "1" : "0"); } catch (err) {}
      syncMute();
      startMusic();
    });
  </script>
</body>
</html>
